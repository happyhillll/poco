<script type="text/babel">
const st = document.getElementById('stage');
// Scale so the whole 1440×900 design fits, then stretch the frame over the leftover space (no empty bands).
const fit = () => { const s = Math.min(innerWidth/1440, innerHeight/900), w = innerWidth/s, h = innerHeight/s;
  st.style.width = w+'px'; st.style.height = h+'px'; st.style.setProperty('--pw', w+'px'); st.style.setProperty('--ph', h+'px');
  st.style.transform = `scale(${s})`; };
fit(); addEventListener('resize', fit);
